project_id = "faden-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3001/**", "http://localhost:3002/**"]
jwt_expiry = 3600
enable_signup = true
enable_manual_linking = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

# Local-only deterministic OTP. Production uses a configured SMS provider.
[auth.sms.test_otp]
"919999999999" = "123456"

# A mapped test number never sends an external request, but GoTrue requires a
# provider to enable the phone identity flow. These values are local-only.
[auth.sms.twilio]
enabled = true
account_sid = "local-test-account"
message_service_sid = "local-test-service"
auth_token = "local-test-token"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
