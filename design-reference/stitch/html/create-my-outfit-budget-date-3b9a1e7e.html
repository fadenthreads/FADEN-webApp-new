<body class="bg-background min-h-screen flex flex-col antialiased">

<div class="w-full md:w-5/12 flex flex-col justify-between sticky top-12">
<div>

<div class="hidden md:block w-full h-[614px] rounded-lg overflow-hidden border border-surface-container-highest mt-8">

<!-- Dates Section -->
<section>
<h2 class="font-headline-md text-headline-md text-on-surface mb-8">Timeline</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<div class="relative group">
<label class="font-label-sm text-label-sm text-on-surface-variant absolute -top-4 left-0 transition-all group-focus-within:text-primary-container group-focus-within:-top-5" for="event_date">When is your event?</label>
<input class="input-underline w-full font-body-lg text-body-lg text-on-surface pt-4 pb-2 appearance-none" id="event_date" name="event_date" type="date"/>
</div>
<div class="relative group">
<label class="font-label-sm text-label-sm text-on-surface-variant absolute -top-4 left-0 transition-all group-focus-within:text-primary-container group-focus-within:-top-5" for="delivery_date">When would you like your outfit?</label>
<input class="input-underline w-full font-body-lg text-body-lg text-on-surface pt-4 pb-2 appearance-none" id="delivery_date" name="delivery_date" type="date"/>
</div>
</div>
</section>
<!-- Budget Section -->
<section>
<h2 class="font-headline-md text-headline-md text-on-surface mb-8">Investment Level</h2>
<div class="grid grid-cols-2 md:grid-cols-3 gap-4">

<span class="font-headline-md text-headline-md">Under ₹10k</span>
</label>

</label>

<span class="font-headline-md text-headline-md">₹25k–50k</span>
</label>
<label class="budget-card cursor-pointer rounded-DEFAULT p-6 flex flex-col items-center justify-center text-center h-32 surface-container-lowest" onclick="selectBudget(this)">

<script>
        function selectBudget(element) {
            // Remove selected class from all
            document.querySelectorAll('.budget-card').forEach(card => {
                card.classList.remove('selected', 'bg-primary-container', 'text-white', 'border-primary-container');
                card.classList.add('surface-container-lowest', 'text-on-surface');
            });
            
            // Add selected class to clicked
            element.classList.add('selected', 'bg-primary-container', 'text-white', 'border-primary-container');
            element.classList.remove('surface-container-lowest', 'text-on-surface');
            
            // Check the hidden radio button
            element.querySelector('input[type="radio"]').checked = true;
        }
    </script>
