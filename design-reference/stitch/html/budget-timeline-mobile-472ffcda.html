<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        /* Custom Input Underline Style */
        .input-underline {
            border: none;
            border-bottom: 1px solid theme('colors.on-background');
            background: transparent;
            border-radius: 0;
            padding: 8px 0;
        }
        .input-underline:focus {
            outline: none;
            box-shadow: none;
            border-bottom: 2px solid theme('colors.primary-container');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="antialiased pb-24">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-20 w-full fixed z-50 bg-background/80 backdrop-blur-md w-full top-0 left-0 border-b border-outline-variant">
<button class="scale-95 active:opacity-80 transition-all text-on-surface-variant hover:text-tertiary transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="font-display-lg text-display-lg-mobile uppercase tracking-widest text-primary">
            FADEN
        </div>
<button class="scale-95 active:opacity-80 transition-all text-on-surface-variant hover:text-tertiary transition-colors opacity-0 pointer-events-none">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-24 px-margin-mobile">
<!-- Step Indicator -->
<div class="mb-8 flex items-center gap-2">
<div class="h-1 flex-1 bg-primary-container rounded-full"></div>
<div class="h-1 flex-1 bg-primary-container rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
</div>
<section class="mb-12">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-2">Budget &amp; Timing</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Let's refine the parameters for your bespoke creation.</p>
</section>
<!-- Budget Selection -->
<section class="mb-12">
<h2 class="font-headline-md text-headline-md mb-6">Investment Level</h2>
<div class="space-y-4">
<!-- Option 1 -->
<label class="block relative group cursor-pointer">
<input class="peer sr-only" name="budget" type="radio" value="accessible"/>
<div class="p-6 border border-outline-variant bg-surface-container-lowest peer-checked:border-primary peer-checked:bg-surface-container-low transition-all">
<div class="flex justify-between items-start mb-2">
<span class="font-headline-md text-headline-md">Essentials</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">$500 - $1,000</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Premium fabrics, tailored fit, essential detailing. Perfect for foundational wardrobe pieces.</p>
<div class="absolute top-6 right-6 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</div>
</div>
</label>
<!-- Option 2 -->
<label class="block relative group cursor-pointer">
<input checked="" class="peer sr-only" name="budget" type="radio" value="elevated"/>
<div class="p-6 border border-outline-variant bg-surface-container-lowest peer-checked:border-primary peer-checked:bg-surface-container-low transition-all">
<div class="flex justify-between items-start mb-2">
<span class="font-headline-md text-headline-md">Atelier</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">$1,000 - $3,000</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Luxury textiles, intricate construction, personalized embellishments. The true bespoke experience.</p>
<div class="absolute top-6 right-6 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</div>
</div>
</label>
<!-- Option 3 -->
<label class="block relative group cursor-pointer">
<input class="peer sr-only" name="budget" type="radio" value="couture"/>
<div class="p-6 border border-outline-variant bg-surface-container-lowest peer-checked:border-primary peer-checked:bg-surface-container-low transition-all">
<div class="flex justify-between items-start mb-2">
<span class="font-headline-md text-headline-md">Couture</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">$3,000+</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Uncompromising materials, artisanal techniques, unlimited revisions. A wearable masterpiece.</p>
<div class="absolute top-6 right-6 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</div>
</div>
</label>
</div>
</section>
<!-- Date Selection -->
<section class="mb-12">
<h2 class="font-headline-md text-headline-md mb-6">Timeline</h2>
<div class="space-y-8">
<div class="relative">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant absolute -top-4 left-0">Event Date (Optional)</label>
<input class="w-full input-underline font-body-md text-body-md mt-4 text-on-background" type="date"/>
</div>
<div class="relative">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant absolute -top-4 left-0">Preferred Delivery</label>
<select class="w-full input-underline font-body-md text-body-md mt-4 text-on-background appearance-none">
<option>Standard (4-6 Weeks)</option>
<option>Priority (2-3 Weeks) +$200</option>
<option>Rush (1 Week) +$500</option>
</select>
<div class="absolute right-0 bottom-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Image for visual balance -->
<div class="mb-12 border border-outline-variant p-2">
<div class="bg-cover bg-center w-full h-48 filter grayscale hover:grayscale-0 transition-all duration-500" data-alt="A close-up shot of hands measuring luxurious cream-colored fabric with a wooden measuring tape. Warm, high-contrast studio lighting highlighting the texture of the material. Editorial fashion photography style, elegant and precise." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD1Ls9aI3S9IulJW3yMDyXnwCbtIVdwJbup_OCDwRXNXLWvAG-yYq4fJdqjlXu07ZHqGlaaIi0BR-raLw9hex8DiSwaVbB6wscg1Sm_wODFP5bJqUBwf_PjKXOhjrOnZKOBbteq8nLpLdrhwfyRhTKOGZowI55NUFfhM7iUWNLPcbYEoCq7QOPzz-0bSmAFIvGBBqN_jS7XcrI8QbYANd8n_3Ftck7_y4uXnoTsNnpHMhdulzcSFYXq')"></div>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 w-full p-4 bg-background border-t border-outline-variant z-50">
<button class="w-full bg-[#1A1A1A] hover:bg-[#313030] text-white font-display-lg text-[16px] py-4 px-8 uppercase tracking-widest transition-colors flex justify-center items-center gap-2">
            Continue to Details
            <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</body></html>
