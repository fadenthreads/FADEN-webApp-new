<script>
        function toggleSelection(element, groupName) {
            // Unselect all others in the group (single selection logic)
            // If you want multi-select, remove this block
            const allInGroup = document.querySelectorAll(`.selectable-card[onclick*="${groupName}"], .pill-select[onclick*="${groupName}"]`);
            allInGroup.forEach(el => {
                if (el !== element) {
                    el.classList.remove('selected');
                }
            });
            
            // Toggle current
            element.classList.toggle('selected');
            
            // Show action area if anything is selected
            checkSelections();
        }
        
        function checkSelections() {
            const anySelected = document.querySelectorAll('.selected').length > 0;
            const actionArea = document.getElementById('nextActionArea');
            
            if (anySelected) {
                actionArea.classList.remove('translate-y-full');
            } else {
                actionArea.classList.add('translate-y-full');
            }
        }
    </script>
