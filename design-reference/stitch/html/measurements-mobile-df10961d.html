<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create My Outfit - Measurements</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&amp;family=Syne:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#b75760",
                        "inverse-on-surface": "#f3f0ef",
                        "surface-tint": "#974730",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#ffb5a0",
                        "secondary": "#775a19",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f6f3f2",
                        "on-primary-container": "#fffdff",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e5e2e1",
                        "secondary-fixed": "#ffdea5",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eded",
                        "primary": "#94452e",
                        "background": "#fcf9f8",
                        "tertiary": "#983f49",
                        "on-secondary-fixed": "#261900",
                        "surface-bright": "#fcf9f8",
                        "surface": "#fcf9f8",
                        "error-container": "#ffdad6",
                        "on-surface": "#1c1b1b",
                        "surface-dim": "#dcd9d9",
                        "inverse-surface": "#313030",
                        "on-surface-variant": "#55433e",
                        "on-secondary-fixed-variant": "#5d4201",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#78301b",
                        "tertiary-fixed-dim": "#ffb2b6",
                        "on-secondary-container": "#785a1a",
                        "primary-fixed-dim": "#ffb5a0",
                        "error": "#ba1a1a",
                        "on-background": "#1c1b1b",
                        "outline": "#88726d",
                        "tertiary-fixed": "#ffdadb",
                        "on-primary-fixed": "#3b0900",
                        "on-tertiary-fixed": "#40000d",
                        "on-tertiary-fixed-variant": "#7c2a34",
                        "outline-variant": "#dbc1ba",
                        "on-tertiary-container": "#fffcff",
                        "primary-container": "#b35d44",
                        "secondary-container": "#fed488",
                        "surface-variant": "#e5e2e1",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#eae7e7",
                        "primary-fixed": "#ffdbd1",
                        "secondary-fixed-dim": "#e9c176"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "section-gap": "120px",
                        "margin-mobile": "20px",
                        "gutter": "24px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "display-lg": ["Syne"],
                        "body-md": ["Karla"],
                        "body-lg": ["Karla"],
                        "headline-lg-mobile": ["Syne"],
                        "headline-md": ["Syne"],
                        "display-xl": ["Syne"],
                        "label-sm": ["Karla"],
                        "headline-lg": ["Syne"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "display-xl": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .step-indicator {
            transition: width 0.3s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- Top App Bar (Modified for transactional context) -->
<header class="flex justify-between items-center px-margin-mobile h-20 w-full fixed z-50 bg-background/80 backdrop-blur-md border-b border-outline-variant dark:border-outline flat no shadows top-0 left-0">
<button class="text-on-surface-variant p-2 scale-95 active:opacity-80 transition-all hover:text-tertiary">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-display-lg text-headline-lg-mobile uppercase tracking-widest text-primary dark:text-primary-fixed-dim">FADEN</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow pt-24 px-margin-mobile pb-32">
<!-- Progress -->
<div class="w-full bg-surface-variant h-1 rounded-full mb-8 overflow-hidden">
<div class="bg-primary h-full step-indicator w-2/5"></div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-4 text-on-background">Your Dimensions</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8">How would you like to provide your measurements? We offer precise options to ensure a flawless fit.</p>
<!-- Measurement Options -->
<div class="space-y-4">
<!-- Option 1 -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant p-6 rounded-lg hover:border-primary transition-colors group relative overflow-hidden active:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="flex items-start justify-between">
<div>
<h3 class="font-headline-md text-headline-md mb-2 text-on-surface">I know my measurements</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Enter them manually. Best if you have a recent tailor profile.</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="straighten">straighten</span>
</div>
</button>
<!-- Option 2 -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant p-6 rounded-lg hover:border-primary transition-colors group relative overflow-hidden active:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="flex items-start justify-between">
<div>
<h3 class="font-headline-md text-headline-md mb-2 text-on-surface">Video Fitting</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Use our AI-powered camera tool. Takes 2 minutes, highly accurate.</p>
<span class="mt-3 inline-block bg-secondary-container text-on-secondary-container px-2 py-1 rounded font-label-sm text-label-sm uppercase tracking-wider">Recommended</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="videocam">videocam</span>
</div>
</button>
<!-- Option 3 -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant p-6 rounded-lg hover:border-primary transition-colors group relative overflow-hidden active:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 opacity-75">
<div class="flex items-start justify-between">
<div>
<h3 class="font-headline-md text-headline-md mb-2 text-on-surface">Send me a kit</h3>
<p class="font-body-md text-body-md text-on-surface-variant">We'll mail you a physical measuring tape and guide.</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="local_shipping">local_shipping</span>
</div>
</button>
</div>
<!-- Privacy Note -->
<div class="mt-12 flex items-center justify-center space-x-3 text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-[18px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm tracking-widest uppercase">Privacy First. Data securely encrypted.</span>
</div>
</main>
<!-- Bottom Action Bar (Transactional) -->
<div class="fixed bottom-0 w-full bg-background border-t border-outline-variant p-4 z-50">
<button class="w-full bg-[#1A1A1A] text-white font-headline-md text-[18px] py-4 rounded-full active:bg-[#2A2A2A] transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
            Continue
        </button>
</div>
</body></html>
